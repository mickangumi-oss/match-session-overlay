<!doctype html>
<html lang="ja-jp">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Session Stats</title>
    <link rel="stylesheet" href="./stats.css" />
  </head>
  <body>
    <main class="stats-window no-chart" id="statsWindow">
      <div class="hud-background" aria-hidden="true"></div>
      <div class="window-actions floating-window-actions">
        <button id="resetButton" data-i18n-aria-label="resetStats" data-i18n-title="resetStats" aria-label="戦績をリセット" title="戦績をリセット">↻</button>
        <button id="hideButton" data-i18n-aria-label="closeStats" data-i18n-title="closeStats" aria-label="戦績ウィンドウを閉じる" title="戦績ウィンドウを閉じる">×</button>
      </div>
      <section class="summary">
        <div class="record-group" data-display-card="record" data-i18n-aria-label="winsLosses" aria-label="勝数と敗数">
          <span class="record-labels"><span>W</span><span>L</span></span>
          <strong class="record-values"><span id="recordWins">0</span><span>-</span><span id="recordLosses">0</span></strong>
        </div>
        <span class="divider"></span>
        <div class="metric-group" data-display-card="winRate">
          <small data-i18n="winRate">勝率</small>
          <strong class="accent" id="winRate">0.0%</strong>
        </div>
        <span class="divider"></span>
        <div class="metric-group" data-display-card="currentRating">
          <small id="currentRatingLabel">CURRENT MR</small>
          <strong id="currentRating">—</strong>
        </div>
        <span class="divider"></span>
        <div class="metric-group" data-display-card="ratingDelta">
          <small id="ratingTypeLabel">MR</small>
          <strong id="ratingDelta">±0</strong>
        </div>
        <span class="divider"></span>
        <div class="metric-group potential-group" data-display-card="potentialRating">
          <small id="medianRatingLabel">POTENTIAL MR</small>
          <strong id="medianRating">—</strong>
        </div>
        <span class="divider"></span>
        <div class="metric-group peak-group" data-display-card="sessionPeak">
          <small data-i18n="sessionPeak">SESSION PEAK</small>
          <strong id="sessionPeakRating">—</strong>
        </div>
        <span class="divider"></span>
        <div class="metric-group rank-group" data-display-card="mrRank">
          <small>CHARACTER RANK</small>
          <strong id="mrRank">—</strong>
          <span class="rank-delta" id="mrRankDelta">—</span>
        </div>
      </section>
      <section class="stats-chart" id="statsChartPanel" data-display-card="graph">
        <header>
          <span class="chart-label" id="statsChartLabel">MR TREND</span>
          <span class="chart-state" id="statsChartState" data-i18n="dataWaiting">データ待機中</span>
        </header>
        <div class="stats-chart-body">
          <canvas id="statsRatingChart" data-i18n-aria-label="graphAriaLabel" aria-label="起動後のMR推移グラフ"></canvas>
          <p class="stats-chart-empty" id="statsChartEmpty"><span data-i18n="graphEmptyRanked">ランクマッチを計測するとグラフが表示されます</span></p>
        </div>
      </section>
    </main>
    <script src="./i18n.js"></script>
    <script src="./stats.js"></script>
  </body>
</html>
